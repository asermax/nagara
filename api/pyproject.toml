[project]
name = "nagara-api"
version = "0.1.0"
description = "Nagara API — enqueue → eager-generate → pollable item (experiment 001 spike)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "trafilatura",
    "sqlalchemy",
    "modal",
    "pydantic-settings",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "ruff",
    "ty",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
