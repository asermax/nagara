[project]
name = "nagara-api"
version = "0.1.0"
description = "Nagara API — enqueue → eager-generate → pollable read-along audio item"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "trafilatura",
    "sqlalchemy",
    "modal",
    "pydantic-settings",
    "psycopg2-binary>=2.9.12",
    "asyncpg>=0.30.0",
    "aiosqlite>=0.20.0",
    "boto3>=1.43.50",
    "alembic>=1.18.5",
    "markdown-it-py>=4.2.0",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "ruff",
    "ty",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
